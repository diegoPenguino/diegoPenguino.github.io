# Content of /resources_for_cp, rendered by _layouts/cp-resources.html.
# Notes accept Markdown. A section can have text, cards, rows, groups (titled rows) or tabs (titled cards).
sections:
- id: lenguajes
  title: Lenguajes de programación
  text: |-
    Inicialmente es importante entender que es mucho mejor programar en C++ que en otros lenguajes de programación, ya que otros pueden resultar más lentos o complejos al momento de competir y en competencias de programación competitiva el tiempo es muy importante.<br>
    Sobre todo, si uno aspira a competir en [IOI](https://ioinformatics.org), donde C++ es el único lenguaje permitido.
- id: tutoriales
  title: Tutoriales de C++
  text: Los primeros dos enseñan desde lo más básico, pero no enseñan todo lo necesario para competir en la IOI, por lo que es necesario aprender más sobre C++.
  cards:
  - name: USACO Guide
    url: https://usaco.guide
    note: La cual yo personalmente considero ser la mejor guía para aprender programación competitiva, cuenta con tutoriales de todos los temas necesarios para competir en la IOI, además de contar con una lista de problemas recomendados para cada tema. Es indispensable utilizar USACO para ser un buen competidor.
    top: true
  - name: Hackerearth CodeMonk
    url: https://www.hackerearth.com/practice/codemonk/
    note: Un buen lugar con tutoriales y ejercicios para aprender C++, altamente recomendable debido a lo organizado que está y la facilidad de aprender con sus tutoriales.
  - name: Cursos de OmegaUp
    url: https://omegaup.com/course/
    note: Distintos cursos que pueden ser de utilidad, la ventaja de estos es que son en español.
  - name: AIZU OJ
    url: https://onlinejudge.u-aizu.ac.jp/courses/list
    note: Hay un curso que contiene problemas, mas no tiene tutoriales.
- id: otras-guias
  title: Otras guías y recursos
  cards:
  - name: W3 Schools
    url: https://www.w3schools.com
    note: Una página con tutoriales y ejemplos de todo lo relacionado a las estructuras de C++.
  - name: SoloLearn
    url: https://www.sololearn.com
    note: Cuenta con cursos de distintos lenguajes de programación, incluyendo C++ y Python, cuenta con una aplicación para celular, y en general es muy recomendable para aprender conceptos de estos lenguajes. Además de ser recomendado por la guía de USACO.
  - name: Codecademy
    url: https://www.codecademy.com
    note: Similar a SoloLearn, ofrece cursos de C++ y Python.
- id: algoritmos
  title: Algoritmos y estructuras de datos
  cards:
  - name: CP Algorithms
    url: https://cp-algorithms.com
    note: Cuenta con extensas explicaciones e implementaciones muy buenas de casi todo tipo de algoritmo y estructura de datos, además de contar con problemas para practicar.
  - name: Visual Algo
    url: https://visualgo.net/en
    note: Una página que explica distintos algoritmos y estructuras de datos de forma visual, muy útil para entender mejor cómo funcionan.
- id: libros
  title: Libros
  groups:
  - label: Libros de programación competitiva
    rows:
    - name: Competitive Programming
      url: https://cpbook.net
      author: Steven Halim, Suhendry Effendy
      note: Un libro que es completamente necesario leer si se aspira a ser bueno en competencias de programación.<br> Cada tema explicado cuenta con una extensa lista de problemas a resolver. <br> La primera edición es gratis.<br><br> De aquí en adelante nos referiremos a este libro como CP4
    - name: Competitive Programmer's Handbook
      url: https://cses.fi/book.html
      author: Antti Laaksonen
      note: También indispensable leerlo, con la ventaja de que este libro tiene más implementaciones y es más directo explicando los distintos temas.<br> Además es de libre acceso.
    - name: Introducción en C++ a la Programación Competitiva
      url: https://www.clasespersonales.com/IntroduccionProgramacionCompetitiva.pdf
      author: Capitulo estudiantil ICPC UMSA
      note: Escrito por estudiantes y competidores de la UMSA en La Paz - Bolivia, a pesar de que su contenido no es tan fuerte, sus explicaciones son muy claras y es un buen libro para empezar.
    - name: Problemas y Algoritmos
      url: https://omegaup.com/docs/assets/libroluisvargas.pdf
      author: Luis E. Vargas Azcona
      note: Otro libro en español, que además de tener implementaciones de distintos algoritmos, explica muy bien la lógica y la teoría detrás de cada uno.
  - label: Libros de matemáticas
    empty: Coming soon
- id: jueces
  title: Jueces online
  text: Los jueces online son páginas que permiten resolver problemas de programación competitiva, y que además califican las soluciones de forma automática.
  tabs:
  - label: Competencias periódicas
    cards:
    - name: Codeforces
      url: https://codeforces.com
      note: El juez online más popular, tiene competencias con problemas nuevos cada semana, su sistema de ranking es muy eficiente en determinar el nivel de los competidores.<br> Además al tener competencias semanales, tiene una cantidad inmensa de problemas, todos con tags para poder identificar con que temas se resuelven, y la mayoría de ellos con editoriales para poder comprender como resolverlos.
    - name: AtCoder
      url: https://atcoder.jp
      note: Juez online japones, parecido a Codeforces, pero con problemas de un enfoque distinto.
    - name: CodeChef
      url: https://www.codechef.com
      note: Parecido a los dos anteriores, pero sus distintos tipos de competencias dan variedad a la clase de problemas que se pueden encontrar aquí.
  - label: En español
    cards:
    - name: OmegaUp
      url: https://omegaup.com
      note: Juez online creado en México, que cuenta con una gran cantidad de problemas y cursos en español.
    - name: beecrowd
      url: https://www.beecrowd.com.br/judge/es/
      note: Juez online brasileño. <br> Muy buen recurso para problemas en español, además ordenados en categorías.
    - name: JukiJudge
      url: https://judge.juki.app/
      note: Juez con problemas en español, que cuenta con una gran cantidad de problemas de la OBI.
    - name: OIAJ
      url: https://juez.oia.unsam.edu.ar
      note: Juez de la Olimpiada Informática Argentina, también cuenta con una gran cantidad de problemas en español usados en su olimpiada y de distintos temas.
  - label: Clásicos
    cards:
    - name: Kattis
      url: https://open.kattis.com
      note: Posee una organización por dificultad impecable, además de ser usado bastante por el libro CP4.
    - name: UVa Online Judge
      url: https://onlinejudge.org
      note: Algo antiguo, pero con una cantidad loquísima de problemas de todo tipo, muy usado hoy en día por el libro CP4.<br> Se recomienda ver sus problemas desde [Vjudge](https://vjudge.net/problem), ya que la interfaz de vjudge es más amigable. <br>  También es importante mencionar a [uHunt](https://uhunt.onlinejudge.org); una herramienta indispensable para trabajar con UVa, ya que viene por defecto con las listas de problemas recomendados en el CP4.
    - name: SPOJ
      url: https://www.spoj.com
      note: Otro juez que ha existido por muchos años, su gran cantidad de problemas disponibles lo hace igual muy bueno para practicar.
    - name: Project Euler
      url: https://projecteuler.net
      note: No es un juez realmente, pero cuenta con una inmensidad de problemas matemáticos y de razonamiento que se pueden resolver con la ayuda de un programa de computadora y mucho razonamiento. <br> Es altamente recomendable para practicar la lógica matemática.
    after: Para UVa y muchos otros jueces existe la herramienta [uDebug](https://www.udebug.com), en la que puedes poner casos de prueba para los problemas de estos jueces, y ver cuál es la salida esperada para dichos casos de prueba.
  - label: Olimpiadas
    cards:
    - name: CSES
      url: https://cses.fi
      note: Juez online creado por el autor del Competitive Programmer's Handbook, tiene una [organización por categorías PERFECTA](https://cses.fi/problemset/) y contiene problemas de la [BOI](https://cses.fi/boi/list/) y [CEOI](https://cses.fi/ceoi/list/) hasta el año 2021.
    - name: oj.uz
      url: https://oj.uz
      note: Este juez tiene [problemas de muchísimas olimpiadas internacionales](https://oj.uz/problems/source) grandes en el mundo, no siempre se mantiene actualizado, pero al menos para IOI y APIO si lo hace.
    - name: AIZU OJ
      url: https://onlinejudge.u-aizu.ac.jp/home
      note: Juez online de la Universidad de Aizu en Japón, tiene problemas de la [JOI](https://onlinejudge.u-aizu.ac.jp/challenges/sources/JOI) y otras competencias de gran nivel.<br> Además cuenta con un curso de C++ con problemas relacionados a cada tema aprendido, lamentablemente no tiene tutoriales.
    after: |-
      En el caso de oj.uz, que es el juez que recomendamos para practicar con problemas IOI, solo están disponibles los problemas en inglés. <br>
      Las traducciones, soluciones y comentarios de todos los problemas de IOI hasta el año 2021 se pueden encontrar en [History of the International Olympiad in Informatics by Mārtiņš Opmanis](https://ioi.te.lv/contest/prev.shtml) o en el [sitio oficial de la IOI](https://ioinformatics.org/page/contests/10).

      Para compilar y correr los problemas con formato IOI en Codeblocks, pueden leer la siguiente guía: [Compilar y correr problemas IOI en Codeblocks](materials/Compilar%20formato%20IOI%20en%20Codeblocks.pdf).<br>
      Para compilarlos desde consola, solo usar los comandos que vienen en el archivo *compile_cpp.sh* dentro de la carpeta de cada problema.
- id: listas
  title: Listas de problemas y roadmaps
  rows:
  - name: Lista creada por el Dr. Mostafa Saad Ibrahim
    url: https://docs.google.com/spreadsheets/d/1-n9Fnvhsnvsqh-IerE_yyIshw5RUNer_7EjwF_GW-TA/edit#gid=0
    note: Como el mismo Dr. explica en este [post de Codeforces](https://codeforces.com/blog/entry/79231) esta lista ha recibido feedback muy positivo a través de los años, contiene problemas por categorías y por dificultad. <br> Además contiene links para editoriales y soluciones de muchos problemas.
  - name: Lista para programadores nuevos
    url: https://docs.google.com/spreadsheets/d/1iJZWP2nS_OB3kCTjq8L6TrJJ4o-5lhxDOyTaocSYc-k/edit#gid=84654839
    note: Igualmente creada por el Dr. Mostafa, esta lista contiene problemas organizados por dificultad, pero esta vez enfocada a programadores nuevos.
  - name: CSES problemset
    url: https://cses.fi/problemset/list/
    note: Como ya se mencionó, esta lista contiene categorías muy bien organizadas, muy recomendado para aprender lo básico sobre cada tema.
  - name: Las siempre confiables A2OJ ladders, renovadas
    url: https://c2-ladders-juol.onrender.com
    note: Reconstruida por [codemastercpp](https://codeforces.com/blog/entry/99896) a partir de lo que solían ser las ladders de A2OJ, esta página contiene problemas de Codeforces organizados de una manera extraordinaria, cada problema mencionado es muy recomendable, ya que no fue seleccionado por azar.
  - name: Checklist de problemas
    url: https://docs.google.com/spreadsheets/d/1-kY6uiLOo1AKSBCSjbpGRBZbIldO_3dg6oTRKIJzT-g/edit#gid=0
    note: Creada por [ko_osaga](https://codeforces.com/profile/ko_osaga) y mencionada en su [blog de Codeforces](https://codeforces.com/blog/entry/59422), tiene problemas de distintas Olimpiadas Internacionales, solo hay que descargar la lista e ir checkeando cuando se resuelve un problema.
  - name: Competitive Programming Roadmap
    url: https://codeforces.com/blog/entry/111099
    note: Creada por [TheScrasse](https://codeforces.com/profile/TheScrasse), es un roadmap (camino a seguir) para convertirse en un programador competitivo de al menos nivel intermedio. <br>Enfocada a ser azul en Codeforces.
  - name: NeetCode
    url: https://neetcode.io/roadmap
    note: Página con un roadmap para aprender programación competitiva, además de contar con una lista de problemas recomendados para cada tema.
  - name: ACodedaily
    url: https://acodedaily.com
    note: Esta página cuenta con problemas organizados por dificultad segun Codeforces, además de contar con una lista de problemas recomendados para cada tema.<br> Muy recomendable para subir de nivel en Codeforces.
