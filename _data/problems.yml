- year: 2019
  note_es: "***El año 2019 cree alrededor de 12 problemas aparte de estos 3, la mayoria de un nivel bajo de dificultad, pero incluido entre estos estaba uno de mis favoritos de toda la vida: \"El sumidero de Pascal\". <br>***\n*Por años pense que eran Lost-Media.<br>*\n*Hasta hoy 05/02/2024 que logre recuperarlos, al no estar disponibles en ningun sitio web actualmente, los guardare por unas semanas hasta poder darles buen uso, de ahi los subire aca ;)*"
  note_en: "In 2019 I created around 12 problems besides these 3, most of them easy, but among them was one of my all-time favorites: \"El sumidero de Pascal\". For years I thought they were lost media, until 05/02/2024, when I managed to recover them. They are not available on any website right now; I'll keep them for a few weeks until I can put them to good use, and then I'll upload them here ;)"
