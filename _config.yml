# Site settings. The navigation menu lives in _data/nav.yml; colors and type in assets/css/site.css.

title: Diego Angulo's Place
author: Diego Angulo Ramírez
description: Diego Angulo Ramírez's personal site. Programmer, problemsetter, teacher and student from Cochabamba, Bolivia.
rss-description: Experiences, thoughts and ideas of Diego Angulo Ramírez.
keywords: "diego,angulo,ramirez,ioi,obi,competitor,mipt,student,programmer,math,bolivia,cochabamba"

# Round avatar in the header, also the default share image
avatar: "/assets/img/ChillyWilly.jpg"

# Footer, mobile menu and CV contact links
social-network-links:
  email: "diegoangulo5@gmail.com"
  facebook: diego.anguloramirez
  github: diegoPenguino
  instagram: diegopenguino
  telegram: diegopenguino

# Set explicitly so builds without a GitHub token (local, CI) use the real domain
url: https://penguino.space
baseurl: ""

# Needed by jekyll-github-metadata (bundled with github-pages) for local and CI builds
repository: diegoPenguino/diegoPenguino.github.io

# Blog comments (Firebase Authentication + Firestore). These values are public by design;
# Firestore security rules in firebase/firestore.rules protect the data. Leave projectId
# empty to hide comments. recaptchaSiteKey is optional (App Check).
firebase:
  apiKey: "AIzaSyCx6kz6L01-roRK4Co_qIbDoqa8OCbMwIg"
  authDomain: "penguin-blog-6526c.firebaseapp.com"
  projectId: "penguin-blog-6526c"
  appId: "1:728883874771:web:b168c3193682639fc4fd26"
  recaptchaSiteKey: ""
  admin-email: diegoangulo5@gmail.com

collections:
  projects:
    output: true
    permalink: /:collection/:title/

# Words in each post excerpt in the RSS feed
excerpt_length: 50

timezone: "America/La_Paz"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      # Each post sets `slug`; old /YYYY/MM/DD/name.html URLs live in its `redirect_from`
      permalink: /blog/:slug/
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor/
  - .bundle/
  - .ruby-version
  - AGENTS.md
  - CLAUDE.md
  - firebase/

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
