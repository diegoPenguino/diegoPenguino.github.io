{%- assign c = include.c -%}
<div class="card card--link res-card{% if c.top %} is-top{% endif %}">
  <span class="name"><a href="{{ c.url }}" target="_blank" rel="noopener">{{ c.name }}</a>{% if c.top %}<span class="top">top</span>{% else %}<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2h6v6M10 2L3 9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>{% endif %}</span>
  {{ c.note | markdownify }}
</div>
