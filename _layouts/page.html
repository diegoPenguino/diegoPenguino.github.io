---
layout: base
---
<div class="field">
  <div class="wrap page-head page-head--dark">
    <h1 class="h1">{{ page.title }}</h1>
    {% if page.subtitle and page.subtitle != '' %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
  </div>
</div>
<div class="wrap">
  <div class="prose page-body">
    {{ content | replace: '<img ', '<img loading="lazy" decoding="async" ' }}
  </div>
</div>
